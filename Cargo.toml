
[profile.release]
# High level of Debug symbols
# debug = 2

# No debug symbols
# debug = false

# Optimization settings w/out debug symbols

opt-level = 3
strip = false
# debug = false
# With debug symbols
debug = 2
codegen-units = 1
lto = true

[workspace]
resolver = "2"

members = [
    "onboard-computer",
    # "power-system",
    "onboard-computer/protocol", "onboard-computer/esp32c3", "onboard-computer/pico-w", "lc76g",
    # "datarate"
    ]

[workspace.dependencies]
esp-hal = { version = "0.23", features = ["esp32c3"] }
# esp-wifi = { git = "https://github.com/esp-rs/esp-wifi", rev = "887eb22", version = "0.1", features = [
#     "esp32c3",
#     "wifi",
#     "embassy-net",
#     "embedded-svc",
# ] }

# debugging
esp-backtrace = { version = "0.15", features = [
    "esp32c3",
    "panic-handler",
    # "println"
] }
esp-println = { version = "0.13", default-features = false, features = ["critical-section", "esp32c3"] }
# Allocator
# esp-alloc = { version = "0.3.0", features = ["oom-handler"] }

# RP2040
cortex-m = { version = "0.7" }
# Require 0.7.3 because of <https://github.com/rust-embedded/cortex-m/discussions/469>
cortex-m-rt = { version = "0.7.3" }
panic-probe = "0.3"

# Embassy Pico HAL
embassy-rp = { version = "0.3.0", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48", features = [
    "unstable-pac",
    "time-driver",
] }
# Pico W WiFi
cyw43 = { git = "https://github.com/embassy-rs/embassy", rev = "7c49f48", features = ["firmware-logs"] }
# cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "7c49f48", features = ["overclock"] }
cyw43-pio = { git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }

# Embassy
embassy-executor = { version = "0.7", default-features = false }
embassy-sync = { version = "0.6" }
embassy-futures = { version = "0.1", features = [] }
embassy-net = { version = "0.7", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }
embassy-net-driver = { version = "0.2" }
embassy-usb = { version = "0.4", default-features = false }
embassy-time = { version = "0.4" }
embassy-time-queue-utils = { version = "0.1" }
embassy-embedded-hal = { version = "0.3" }


# Keep the same as in esp-wifi
embedded-svc = { version = "0.26", default-features = false, features = [
    "defmt",
] }

embedded-hal-02 = { version = "0.2.7", features = ["unproven"], package = "embedded-hal" }
embedded-hal = { version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-bus = { version = "0.3.0" }
embedded-hal-nb = { version = "1.0.0" }
embedded-storage = "0.3"
# embedded-can = { version = "0.4.1" }
embedded-io-async = { version = "0.6", features = ["defmt-03"] }
embedded-io = { version = "0.6", features = ["defmt-03"] }

futures = { version = "0.3", default-features = false }

log = "0.4"
defmt = { version = "0.3" }
defmt-rtt = "0.4.0"

serde = { version = "1", default-features = false }
postcard = { version = "1", features = ["experimental-derive"] }
postcard-rpc = { version = "0.11" }
postcard-schema = { version = "0.2", features = ["derive"] }
cobs = { version = "0.3", default-features = false }

# required for running tests
critical-section = { version = "1.2", default-features = false }

# Rust-analyzer uses the non-patch version for some reason
nmea = { version = "0.7.0", git = "https://github.com/AeroRust/nmea", branch = "main", default-features = false }
# nmea = { version = "0.7.0", default-features = false }

rand_core = "0.6"
num = { version = "0.4", default-features = false }

portable-atomic = { version = "1.11", default-features = false }
static_cell = { version = "2" }
once_cell = { version = "1.0", default-features = false }
fugit = { version = "0.3", features = ["defmt"] }

# nb = { version = "1.1", features = ["defmt-0-3"] }
heapless = { version = "0.8" }

dotenv = "0.15"

# SD Card
embedded-sdmmc = { version = "0.8.0", default-features = false, features = ["asynch"] }

# Sensors
# Humidity and temperature
shtcx = { version = "1.0" }
# Pressure and temperature sensor
bmp388 = { version = "0.1", features = ["asynch"] }
# air quality
bme68x-rust = { version = "0.1" }
bno055 = { version = "0.3" }

# VOC index
sgp40 = "0.0.4"
icm42670 = { version = "0.1.1" }
lc76g = { path = "./lc76g", version = "0.1" }

# after postcard feature was merged "feat/postcard"
mpu6050 = { package = "mpu6050-dmp", git = "https://github.com/barafael/mpu6050-dmp-rs", rev = "3473785", version = "0.6", features = ["async", "serde", "postcard-experimental"]}

[patch.crates-io]
embassy-executor = { version = "0.7", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-net = { version = "0.7", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-usb = { version = "0.4", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-usb-driver = { version = "0.1", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-time = { version = "0.4", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-time-queue-utils = { version = "0.1", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-time-driver = { version = "0.2", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-sync = { version = "0.6", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }
embassy-embedded-hal = { version = "0.3", git = "https://github.com/embassy-rs/embassy", rev = "7c49f48" }

# IMU that comes on the ESP32-C3-Rust board
icm42670 = { version = "0.1.1", git = "https://github.com/LechevSpace/icm42670", branch = "feat/embedded-hal-async-rc" }

# rev `ae84c82` is the commit that merges `embedded-hal@1.0` traits
bmp388 = { version = "0.1", git = "https://github.com/ibutra/bmp388", branch = "feat/bmp390-support" }
# bmp388 = { version = "0.1", path = "../../Personal/bmp388" }
bno055 = { version = "0.3", git = "https://github.com/LechevSpace/bno055", branch = "all-changes" }

# SD Card
embedded-sdmmc = { version = "0.8.0", git = "https://github.com/LechevSpace/embedded-sdmmc-rs", branch = "feat/async-feature-0.8" }

