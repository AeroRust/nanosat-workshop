[package]
name = "protocol"
version = "0.1.0"
edition = "2021"

[features]
default = ["BMP388", "BNO055", "GNSS", "serde", "postcard", "status", "storage"]
all = ["std", "BMP388", "BNO055", "GNSS", "serde", "postcard", "status", "defmt-03", "bin", "storage"]
# default = []

std = ["serde?/std", "cli", "chrono?/std"]

cli = ["dep:clap"]

defmt-03 = [
    "dep:defmt",
    "bmp388?/defmt-03",
    "bno055?/defmt-03",
    "mpu6050?/defmt-03",
    "nmea?/defmt-03",
    "cobs?/defmt",
    "embedded-sdmmc?/defmt-log",
    "embedded-hal-async?/defmt-03",
    "heapless/defmt-03",
    "postcard/use-defmt",
    "postcard-schema/defmt-v0_3",
]
serde = [
    "dep:serde",
    "bno055?/serde",
    "bmp388?/serde",
    "mpu6050?/serde",
    "nmea?/serde",
    "cobs?/serde",
    "mint?/serde",
    "chrono?/serde",
    "num?/serde",
]
postcard = ["dep:postcard", "dep:postcard-rpc", "dep:postcard-schema", "serde"]
cobs-encoding = ["dep:cobs"]

pressure-and-temperature = []
BMP388 = ["dep:bmp388"]

imu = []
BNO055 = ["dep:bno055"]

# currently not used for the OBC
imu-mpu6050 = ["dep:mpu6050"]

nmea = ["dep:nmea", "nmea/GSA", "nmea/GSV", "nmea/RMC", "nmea/GLL"]
GNSS = ["nmea"]

status = []

# the storage depends on Postcard and serde for serialization
storage = ["filesystem-size-64GB", "dep:embedded-sdmmc", "dep:embedded-hal-async", "postcard", "dep:crc", "dep:num"]

bin = ["std", "dep:serde_json", "dep:chrono", "dep:csv", "dep:mint", "dep:serde", "dep:clap"]
# todo: impl
filesystem-size-16GB = []
# todo: impl
filesystem-size-32GB = []
filesystem-size-64GB = []
# todo: impl
filesystem-size-128GB = []

[dependencies]
serde = { workspace = true, default-features = false, optional = true }
postcard = { workspace = true, optional = true, features = ["experimental-derive"] }
postcard-schema = { workspace = true, optional = true }
postcard-rpc = { workspace = true, optional = true }
cobs = { workspace = true, optional = true, default-features = false }

defmt = { workspace = true, optional = true }

# Sensors, peripherals and parsers
# Pressure and Temperature sensor
bmp388 = { workspace = true, optional = true, features = ["asynch", "config-builder"] }
# Bosh IMU 9DOF
bno055 = { workspace = true, optional = true }
# IMU 6DOF
mpu6050 = { workspace = true, optional = true }
# Parsing NMEA 0183 sentences from GNSS receiver
nmea = { workspace = true, optional = true, default-features = false }

# SD card storage
embedded-sdmmc = { workspace = true, optional = true }
embedded-hal-async = { workspace = true, optional = true }

serde_json = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, optional = true }

heapless = { workspace = true }
# CRC algorithms for SD card storage
crc = { version = "3.2", optional = true }
num = { workspace = true, default-features = false, optional = true }
# Math INteroperability Types used in bno055
mint = { version = "0.5", optional = true }

clap = { version = "4", features = ["cargo", "derive", "env"], optional = true }
csv = { version = "1.3", optional = true }

# [dev-dependencies]
