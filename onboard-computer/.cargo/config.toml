[env]
# ESP_LOGLEVEL="warn"
ESP_LOGLEVEL="info"
DEFMT_LOG = "info"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor -L defmt"
rustflags = [
    # enable defmt
  "-C", "link-arg=-Tdefmt.x",

  "-C",
  "link-arg=-Tlinkall.x",

  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C",
  "force-frame-pointers",

#   # WiFi
#   # "-C", "link-arg=-Trom_functions.x",
]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip RP2040"
# runner = "elf2uf2-rs -d"

[build]

rustdocflags = ["--cfg", "docsrs", "-Z", "unstable-options", "--enable-index-page"]

# [build]
# target = "thumbv6m-none-eabi" # Cortex-M0 and Cortex-M0+
# target = "riscv32imc-unknown-none-elf"

[alias]
# More generic
esp32-c3 = "run --target riscv32imc-unknown-none-elf --release --no-default-features -F esp32-c3"
pico-w = "run --target thumbv6m-none-eabi --release --no-default-features -F pico-w"

demo-obc-wifi = "run --target thumbv6m-none-eabi --release --no-default-features -F demo-obc-wifi"
demo-obc-ap = "run --target thumbv6m-none-eabi --release --no-default-features -F demo-obc-ap"
demo-sd = "run --target thumbv6m-none-eabi --release --no-default-features -F demo-sd"

pico-sky = "run --target thumbv6m-none-eabi --release --no-default-features -F pico-sky"
pico-ground = "run --target thumbv6m-none-eabi --release --no-default-features -F pico-ground"
pico-pressure = "build --target thumbv6m-none-eabi --release --no-default-features -F demo-pressure"
pico-pressure-demo = "run --target thumbv6m-none-eabi --release --no-default-features -F demo-pressure"

esp32-run-demo = "run --target riscv32imc-unknown-none-elf --release --no-default-features -F esp32-humidity"
esp32-demo = "build --target riscv32imc-unknown-none-elf --release --no-default-features -F esp32-humidity"
# pico-w-attach = "probe-rs attach --target thumbv6m-none-eabi --release --no-default-features -F pico-w"

# Building docs for Pico-w locally:
# for `--enable-index-page` it is required to pass `-Z unstable-options` to rustdocs
docs-pico-w = "doc --target thumbv6m-none-eabi --release --no-default-features --document-private-items -p onboard-computer -F pico-w -p pico-w"
